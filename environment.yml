# Conda environment for the prototype. Python from conda-forge only (no Anaconda `defaults` channel);
# everything else from PyPI, pinned to the versions the results were produced with. PyTorch's default
# Linux wheel for 2.14.1 is built against CUDA 13.0 (needs driver >= 580).
name: metric-grounding-audit
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - torch==2.14.1
      - numpy==2.5.4
      - scipy==1.18.1
      - pandas==3.1.0
      - pillow==13.0.0
      - pyyaml==6.0.3
      - h5py==3.16.0
      - opencv-python-headless==5.0.0.93
      - matplotlib==3.11.2
      - transformers==5.21.0
      - pytest==9.1.1
      - -e .
